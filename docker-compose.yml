services:
  rest-api:
    image: "node:20-alpine"
    user: "node"
    working_dir: /home/node/app
    container_name: "${REST_API_CONTAINER_NAME:-slo-rest-api}"
    environment:
      - NODE_ENV=development
      - NODE_PORT=4500
      - NODE_BASE=/
      - NODE_ID_URL=/uuid/
      - NODE_SEARCH_URL=http://search-server:3001
      - NODE_DATA_URL=http://localhost:4500/
      - NODE_SIMPLYSTORE_URL=http://curriculum-store:3000
    volumes:
      - ./curriculum-rest-api/:/home/node/app
    ports:
      - "${REST_API_HOST_PORT:-4500}:4500"
    depends_on:
      - curriculum-store
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        npm ci --no-audit --no-fund
        exec npm start

  search-server:
    image: "node:20-alpine"
    user: "node"
    working_dir: /home/node/app
    container_name: "${SEARCH_CONTAINER_NAME:-slo-search}"
    environment:
      - NODE_ENV=development
      - NODE_PORT=3001
      - DATA_DIR=/home/node/app/curriculum
    volumes:
      - ./curriculum-search-server/:/home/node/app
      - ./curriculum-store/:/home/node/app/curriculum
    ports:
      - "${SEARCH_HOST_PORT:-3001}:3001"
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        npm ci --no-audit --no-fund
        exec npm start

  curriculum-store:
    image: "node:24-alpine"
    user: "node"
    working_dir: /home/node/app
    container_name: "${STORE_CONTAINER_NAME:-curriculum-store}"
    # Allow a running slow query (10 s limit) to finish before SIGKILL, so
    # SimplyStore can release its store lock.
    stop_grace_period: 30s
    environment:
      - NODE_ENV=development
      - NODE_PORT=3000
      - DATA_FILE=/home/node/app/data/data.jsontag
      - COMMANDS=/home/node/app/src/commands.mjs
    volumes:
      - ./curriculum-store/:/home/node/app
    ports:
      - "${STORE_HOST_PORT:-3000}:3000"
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        npm ci --no-audit --no-fund
        exec npm start
  curriculum-registration:
    image: "node:20-alpine"
    user: "node"
    working_dir: /home/node/app
    container_name: "${REGISTRATION_CONTAINER_NAME:-curriculum-registration}"
    environment:
      - NODE_ENV=development
      - NODE_PORT=4930
      - APIKEYS=apiKeys.json
    volumes:
      - ./curriculum-registration-app/:/home/node/app
    ports:
      - "${REGISTRATION_HOST_PORT:-4930}:4930"
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-package-lock --no-audit --no-fund
        fi
        exec npm start
